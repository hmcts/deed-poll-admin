nodejs:
  releaseNameOverride: "{{ .Release.Name }}-web"
  applicationPort: 3000
  aadIdentityName: deed-poll
  ingressHost: deed-poll-admin-web.{{ .Values.global.environment }}.platform.hmcts.net
  image: 'hmctsprod.azurecr.io/deed-poll/deed-poll-admin-web:latest'
  environment:
    # Where `deed-poll-api` is. Every case, note, witness and document this app renders comes from it —
    # `libs/deed-poll/src/api/deed-poll-api.ts` reads this variable and falls back to
    # `http://localhost:3200`, which is the in-repo mock. That default is right for `yarn dev` and wrong
    # for every deployed environment, so this must be set wherever the app is deployed rather than left
    # to the adapter.
    #
    # The CNP internal hostname, not an ingress: api is `charts/deed-poll-api` in `hmcts/deed-poll-api`
    # on the standard `java` base chart, so it answers on
    # `deed-poll-api-{env}.service.core-compute-{env}.internal`, cluster-internal and cleartext. **api
    # is not deployed yet** — its own `docs/plans/jenkins-pipeline-cutover.md` is what makes this host
    # exist — so until it is, a deployed pod's readiness probe reports DOWN. That is the intended
    # failure: see `docs/DEPLOYMENT.md`, "deed-poll-api".
    DEED_POLL_API_URL: http://deed-poll-api-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
    IDAM_ISSUER_URL: https://hmcts-access.{{ .Values.global.environment }}.platform.hmcts.net
    IDAM_CLIENT_ID: deed-poll-admin
    IDAM_SCOPE: openid profile roles offline_access
    # IDAM_REDIRECT_URI is deliberately NOT set here. It has to equal this app's ingressHost plus
    # /oauth2/callback, and `ingressHost` above is overridden per environment by
    # helm/deed-poll-admin/values.template.yaml — so a value written here would be quietly wrong
    # everywhere it is actually deployed, which is what it was. It is set alongside the ingressHost in
    # those root templates instead, and `assertIdamSettings` refuses to start if it is missing or
    # still points at localhost.
  keyVaults:
    deed-poll:
      secrets:
        - name: app-insights-connection-string
          alias: APPLICATION_INSIGHTS_CONNECTION_STRING
        # No `postgres-url` and no database credential of any kind. The data access layer went to
        # `deed-poll-api` — plan 02 of `docs/plans/` — so there is no database for this app to hold a
        # connection string to, and no S2S credential either: api authenticates a **forwarded IDAM
        # access token** and nothing else, so the caseworker's own token in the session is the whole
        # credential. `docs/DEPLOYMENT.md` records why, and why a static service token would be the
        # wrong way to close it if api ever gains a `ServiceAuthorization` filter.
        #
        # Where the session store lives. Written by the shared root in `hmcts/deed-poll-infra`, which
        # provisions one Redis for the product.
        - name: redis-url
          alias: REDIS_URL
        # Both must exist in the vault before this deploys — the chart fails on a missing secret, which
        # is the right way round for these two.
        #
        # `admin-idam-client-secret` is the confidential client's secret, and comes from IDAM's reply to
        # `.business_context/IDAM_REGISTRATION_REQUEST.md`. Until that arrives there is no value to put
        # in the vault, so this cannot deploy yet — deliberately, since the alternative is a client that
        # silently cannot complete a code exchange.
        - name: admin-idam-client-secret
          alias: IDAM_CLIENT_SECRET
        # `admin-session-secret` signs the session cookie, and after Phase 5 the session is what asserts
        # a user is signed in and which roles they hold. `config/default.json` carries a placeholder for
        # local use, and `assertSessionSecret` refuses to start on it outside development and test — a
        # known signing key means anyone can mint a cookie claiming `deedpoll-admin` and never touch
        # IDAM at all, which would make the whole login flow decoration. Generate a random value; it is
        # ours, not IDAM's. Per component rather than shared with `deed-poll-web`: one signing key across
        # a caseworker service and a public one makes a forged cookie portable between them.
        - name: admin-session-secret
          alias: SESSION_SECRET
