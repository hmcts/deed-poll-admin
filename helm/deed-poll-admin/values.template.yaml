# Base values template for production-like environments (AAT, Prod)
# The Key Vault, Redis and App Insights this chart reads are managed by Terraform in
# `hmcts/deed-poll-infra`, not by Helm. There is no database: see `docs/plans/02-dal-cutover-to-api.md`.
global:
  environment: ${ENVIRONMENT:-aat}

# Enable/disable subcharts. One component deploys, and the `postgres`, `api`, `postgresql` and `crons`
# toggles that used to sit here went with the charts they switched — `apps/postgres` and `apps/api` were
# deleted with the data access layer, the per-environment database with them, and `apps/crons` in plan 03
# task 2 as a component that was never written.
web:
  enabled: true

# Web application configuration
deed-poll-admin-web:
  nodejs:
    image: "hmctsprod.azurecr.io/deed-poll/deed-poll-admin-web:${WEB_IMAGE}"
    ingressHost: "${TEAM_NAME}-{{ .Release.Name }}-web.${ENVIRONMENT}.platform.hmcts.net"
    environment:
      # MUST be the ingressHost above with /oauth2/callback on the end, and MUST be registered with
      # IDAM verbatim — IDAM refuses a redirect_uri that does not match a registered one exactly, so a
      # mismatch here breaks login in this environment and nowhere else. Set here rather than in
      # apps/web/helm/values.yaml because that chart's own ingressHost is overridden by this file: the
      # two values have to be decided in the same place or they drift, and the subchart default was
      # already wrong for every deployed environment.
      IDAM_REDIRECT_URI: "https://${TEAM_NAME}-{{ .Release.Name }}-web.${ENVIRONMENT}.platform.hmcts.net/oauth2/callback"
      # `DEED_POLL_API_URL` is deliberately NOT overridden here, unlike the redirect URI above. The
      # subchart's default already resolves per environment from `global.environment`, and api's host is
      # api's to decide — a second spelling of it in this file is the drift the redirect URI comment
      # describes, without the constraint that forces it.
