# Base values template for production-like environments (AAT, Prod)
# Database and cache infrastructure is managed by Terraform, not Helm
global:
  environment: ${ENVIRONMENT:-aat}

# Enable/disable subcharts
postgres:
  enabled: true
web:
  enabled: true
api:
  enabled: true
crons:
  enabled: true

# Web application configuration
deed-poll-admin-web:
  nodejs:
    image: "hmctsprod.azurecr.io/deed-poll/deed-poll-admin-web:${WEB_IMAGE}"
    ingressHost: "${TEAM_NAME}-{{ .Release.Name }}-web.${ENVIRONMENT}.platform.hmcts.net"
    environment:
      # MUST be the ingressHost above with /oauth2/callback on the end, and MUST be registered with
      # IDAM verbatim — IDAM refuses a redirect_uri that does not match a registered one exactly, so a
      # mismatch here breaks login in this environment and nowhere else. Set here rather than in
      # apps/web/helm/values.yaml because that chart's own ingressHost is overridden by this file: the
      # two values have to be decided in the same place or they drift, and the subchart default was
      # already wrong for every deployed environment.
      IDAM_REDIRECT_URI: "https://${TEAM_NAME}-{{ .Release.Name }}-web.${ENVIRONMENT}.platform.hmcts.net/oauth2/callback"

# API application configuration
deed-poll-admin-api:
  nodejs:
    image: "hmctsprod.azurecr.io/deed-poll/deed-poll-admin-api:${API_IMAGE}"
    ingressHost: "${TEAM_NAME}-{{ .Release.Name }}-api.${ENVIRONMENT}.platform.hmcts.net"

# Crons application configuration
deed-poll-admin-crons:
  job:
    image: "hmctsprod.azurecr.io/deed-poll/deed-poll-admin-crons:${CRONS_IMAGE}"
    schedule: "*/5 * * * *"
    suspend: false
    kind: CronJob

# Postgres Prisma Studio service configuration
deed-poll-admin-postgres:
  nodejs:
    image: "hmctsprod.azurecr.io/deed-poll/deed-poll-admin-postgres:${POSTGRES_IMAGE}"
    ingressHost: "${TEAM_NAME}-{{ .Release.Name }}-postgres.${ENVIRONMENT}.platform.hmcts.net"

# Dev dependencies - DISABLED for AAT/Prod (managed by Terraform)
postgresql:
  enabled: false
