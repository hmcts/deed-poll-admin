# Global values shared by all subcharts
global:
  environment: preview
  security:
    allowInsecureImages: true

# Enable/disable subcharts. Kept in step with values.template.yaml deliberately: a preview environment
# that deploys a component AAT does not is a preview of something else. The `postgres`, `api` and
# `postgresql` toggles went with the charts they switched — there is no per-PR database any more, because
# there is nothing in this repo to put in one.
web:
  enabled: true
crons:
  enabled: true

# Web application configuration
deed-poll-admin-web:
  nodejs:
    image: "hmctsprod.azurecr.io/deed-poll/deed-poll-admin-web:${WEB_IMAGE}"
    ingressHost: "${TEAM_NAME}-{{ .Release.Name }}-web.preview.platform.hmcts.net"
    environment:
      # Must match the ingressHost above and be registered with IDAM. `.Release.Name` here is
      # `deed-poll-admin-pr-<n>`, so **every PR has a different hostname** — which is why the
      # registration request asks IDAM for a wildcard covering
      # `deed-poll-deed-poll-admin-pr-*-web.preview.platform.hmcts.net`. Without one, preview
      # environments cannot log in at all and each PR would need its own registration.
      IDAM_REDIRECT_URI: "https://${TEAM_NAME}-{{ .Release.Name }}-web.preview.platform.hmcts.net/oauth2/callback"
      # AAT's api, not a preview one, and overridden here rather than inherited: the subchart's default
      # resolves from `global.environment`, which is `preview`, and there is no
      # `deed-poll-api-preview.service.core-compute-preview.internal` — api's preview deploys are per-PR
      # hosts under `preview.platform.hmcts.net`, one per api PR, so no stable name exists for this app
      # to point at. Pointing a preview at AAT's api is the usual CFT arrangement and has the usual
      # consequence: **preview writes land in AAT's data.** Fine for a caseworker service with no live
      # data yet; revisit before this app carries any.
      DEED_POLL_API_URL: "http://deed-poll-api-aat.service.core-compute-aat.internal"

# Crons application configuration
deed-poll-admin-crons:
  job:
    image: "hmctsprod.azurecr.io/deed-poll/deed-poll-admin-crons:${CRONS_IMAGE}"
    schedule: "*/5 * * * *"  # Every 5 minutes
    suspend: false
    kind: CronJob
    environment:
      SCRIPT_NAME: 'example'
