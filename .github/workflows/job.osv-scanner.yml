name: OSV Scanner Job

on:
  workflow_call:

# `security-events: write` is gone with the SARIF upload. The reusable workflow declares its own job
# permissions regardless, so this block only covers what the caller needs.
permissions:
  contents: read

jobs:
  scan:
    name: Dependency Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      # **Do not upload SARIF.** It requires Code Security, which is `disabled` on this repository and
      # **cannot be enabled** — the API refuses even for a repo admin with *"An enterprise policy
      # prevented modifying Code Security enablement"*. So every run failed with *"Code Security must be
      # enabled for this repository to use code scanning"*, and the job had never passed.
      #
      # Every comparable HMCTS service repo is public (expressjs-monorepo-template, cath-service,
      # pcs-api, rpx-xui-webapp) and public repos get code scanning free, so the real fix is this
      # repository's `internal` visibility rather than this workflow. That decision has a prerequisite —
      # the whole history wants a secret scan first — which is done and recorded in
      # .business_context/PROGRESS.md.
      #
      # **Set this back to the default once the repository is public or Code Security is licensed.** The
      # security tab is the better integration; this is a workaround for an entitlement.
      upload-sarif: false
      # `--fail-on-severity=HIGH` used to be here and **is not a real flag** — it comes from the
      # template, which has the same bug. Nothing in the chain accepts it: the scanner CLI has no
      # severity option at all, and the reporter step gates on `--fail-on-vuln`, which the
      # `fail-on-vuln` input above controls. Passing it made the scanner exit with
      # `Incorrect Usage: flag provided but not defined: -fail-on-severity`, which the reusable
      # workflow's `continue-on-error` then hid. Worth reporting upstream to
      # hmcts/expressjs-monorepo-template.
      #
      # `-r` matches the reusable workflow's own default and is what the removed line was standing in
      # for. There is no way to gate on severity here: it fails on any vulnerability or none.
      scan-args: |-
        --config=.github/osv-scanner.toml
        -r
        ./
