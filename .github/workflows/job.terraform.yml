# Terraform Job
#
# Runs Terraform plan and optionally apply for infrastructure changes.
# This is a thin wrapper around the cnp-githubactions-library terraform-deploy workflow.
#
# Usage (CFT):
#   terraform:
#     uses: ./.github/workflows/job.terraform.yml
#     with:
#       environment: aat
#       subscription: DCD-CNP-DEV
#       aks-subscription: DCD-CFTAPPS-STG
#       storage-account: nonprod
#     secrets: inherit
#
# Usage (SDS - override state store names):
#   terraform:
#     uses: ./.github/workflows/job.terraform.yml
#     with:
#       environment: stg
#       subscription: DTS-SHAREDSERVICES-STG
#       aks-subscription: DTS-SHAREDSERVICES-STG
#       storage-account: nonprod
#       state-store-resource-group: jenkins-state
#       state-store-account-name: sdsstatenonprod
#       state-store-container-name: tfstate-stg
#     secrets: inherit

name: Terraform

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (e.g., aat)"
      storage-account:
        required: true
        type: string
        description: "Storage account postfix (e.g. nonprod, prod) to make mgmtstatestore{nonprod|prod}"
      subscription:
        required: true
        type: string
        description: "Azure subscription name (e.g. DCD-CNP-DEV)"
      aks-subscription:
        required: true
        type: string
        description: "Azure subscription name for AKS cluster (e.g. DCD-CFTAPPS-STG)"
      plan-only:
        required: false
        type: boolean
        default: false
        description: "Run plan only, skip apply"
      working-directory:
        required: false
        type: string
        default: "infrastructure"
      state-store-resource-group:
        required: false
        type: string
        default: ""
        description: "Override resource group name for Terraform state (default: mgmt-state-store-{storage-account})"
      state-store-account-name:
        required: false
        type: string
        default: ""
        description: "Override storage account name for Terraform state (default: mgmtstatestore{storage-account})"
      state-store-container-name:
        required: false
        type: string
        default: ""
        description: "Override container name for Terraform state (default: mgmtstatestorecontainer{environment})"
    outputs:
      plan-exitcode:
        description: "Terraform plan exit code (0=no changes, 2=changes)"
        value: ${{ jobs.terraform.outputs.plan-exitcode }}

jobs:
  terraform:
    name: Terraform ${{ inputs.plan-only && 'Plan' || 'Apply' }}
    uses: hmcts/cnp-githubactions-library/.github/workflows/terraform-deploy.yaml@main
    with:
      environment: ${{ inputs.environment }}
      subscription: ${{ inputs.subscription }}
      aks-subscription: ${{ inputs.aks-subscription }}
      storage-account: ${{ inputs.storage-account }}
      state-store-resource-group: ${{ inputs.state-store-resource-group }}
      state-store-account-name: ${{ inputs.state-store-account-name }}
      state-store-container-name: ${{ inputs.state-store-container-name }}
      working-directory: ${{ inputs.working-directory }}
      plan-only: ${{ inputs.plan-only }}
      helm-chart-path: helm/deed-poll-admin/Chart.yaml
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS_CFT_PREVIEW }}
