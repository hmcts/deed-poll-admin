# OSV Scanner Configuration
# https://google.github.io/osv-scanner/configuration/
#
# There is no severity gate available — the scanner fails on any vulnerability or none — so anything not
# fixable by a version bump has to be either fixed upstream or ignored here with a reason. Every entry
# below states why the code path is unreachable in this service, not merely that it is inconvenient.
#
# Three entries were removed on 2026-09-09 rather than left to expire: two `mysql2` advisories and one
# `deepmerge-ts` advisory, all three ignored only because the Prisma toolchain pinned them exactly. Task 5
# of `docs/plans/completed/02-dal-cutover-to-api.md` deleted the data access layer, so `prisma`, `@prisma/config`
# and every driver the CLI bundled are gone from `yarn.lock` and neither package is in the tree at all.
# An ignore for a package that is no longer a dependency is worse than no ignore: it would silently
# suppress the same advisory if the package ever came back for an unrelated reason.

[[IgnoredVulns]]
id = "GHSA-g9mf-h72j-4rw9"
reason = "This vulnerability doesn't affect our usage because we don't use the affected feature"
ignoreUntil = "2026-12-31T00:00:00Z"
