sonar.projectKey=hmcts.deed-poll-admin
sonar.projectName=Deed Poll :: Deed Poll Admin
sonar.organization=hmcts

# `src` is the application, which has been the root package since plan 03 task 3 flattened `apps/web` into
# it; `libs` is still a workspace, by that plan's decision 5.
sonar.sources=src,libs
sonar.tests=src,libs
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# The `apps/postgres/ccd-runtime/migrations/**` and `**/prisma/migrations/**` exclusions went with plan 02's
# deletion of the data access layer — there is no SQL in this repo to analyse. Kept as a note rather than a
# pattern so nobody re-adds one for a directory that no longer exists.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.d.ts,**/locales/**,**/*config.ts,**/vite.build.ts,**/server.ts,**/app.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Written by `scripts/merge-lcov.mjs`, which `yarn test:coverage` runs after the per-package reports — the
# Jenkins test stage invokes that script, and vitest writes coverage per workspace, so there is no root report
# without the merge. Both spellings because `sonar.typescript.*` is the deprecated one.
sonar.javascript.lcov.reportPaths=lcov.info
sonar.typescript.lcov.reportPaths=lcov.info

sonar.cpd.exclusions=src/pages/**
