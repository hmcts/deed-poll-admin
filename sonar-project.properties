sonar.projectKey=hmcts.deed-poll-admin
sonar.projectName=Deed Poll :: Deed Poll Admin
sonar.organization=hmcts

sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# `apps/postgres/ccd-runtime/migrations/**` is vendored verbatim from hmcts/ccd-config-generator (see
# that directory's README) and must not be edited here, so analysing it can only produce findings nobody
# is permitted to act on. It failed the quality gate on `new_reliability_rating` for a BLOCKER on
# V0005.sql:8 — "Ensure that the WHERE clause is not missing in this UPDATE query" — where the missing
# WHERE is the point: it is a migration backfilling a new column across every existing row, and a WHERE
# clause would make it wrong. Same category as `**/prisma/migrations/**`, already excluded above it. The
# runner beside it (`migrate.ts`, `cli.ts`) is ours and stays analysed.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.d.ts,**/prisma/migrations/**,apps/postgres/ccd-runtime/migrations/**,**/locales/**,**/*config.ts,**/vite.build.ts,**/server.ts,**/app.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

sonar.typescript.lcov.reportPaths=lcov.info

sonar.cpd.exclusions=apps/web/src/pages/**
