nodejs:
  releaseNameOverride: "{{ .Release.Name }}-api"
  applicationPort: 3001
  aadIdentityName: deed-poll
  ingressHost: deed-poll-admin-api.{{ .Values.global.environment }}.platform.hmcts.net
  image: 'hmctsprod.azurecr.io/deed-poll/deed-poll-admin-api:latest'
  environment:
    EXAMPLE_ENV: example
    IDAM_ISSUER_URL: https://idam-web-public.{{ .Values.global.environment }}.platform.hmcts.net/o
    # Which OIDC clients' access tokens this API will accept, by their `aud` claim. IDAM signs for the
    # whole CFT estate, so a valid signature alone only proves "some IDAM token" — this is what stops
    # one issued to another service being replayed here. Comma-separated; an empty value refuses every
    # request rather than accepting any.
    IDAM_API_AUDIENCES: deed-poll-admin
  keyVaults:
    deed-poll:
      secrets:
        - name: app-insights-connection-string
          alias: APPLICATION_INSIGHTS_CONNECTION_STRING
        - name: postgres-url
          alias: DATABASE_URL
