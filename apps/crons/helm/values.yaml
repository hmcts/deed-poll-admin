global:
  jobKind: CronJob
  enableKeyVaults: true
  tenantId: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
job:
  releaseNameOverride: "{{ .Release.Name }}-crons"
  disableActiveClusterCheck: true
  image: hmctsprod.azurecr.io/deed-poll/deed-poll-admin-crons:latest
  aadIdentityName: deed-poll
  environment:
    SCRIPT_NAME: 'example'
  keyVaults:
    deed-poll:
      secrets:
        - name: app-insights-connection-string
          alias: APPLICATION_INSIGHTS_CONNECTION_STRING
        # No `postgres-url`: this repo owns no database since the `deed-poll-api` cutover, and the only
        # script here is the template's `example`. A cron that ever needs case data goes through
        # `libs/deed-poll` and therefore needs `DEED_POLL_API_URL` and a token, not a connection string.
  schedule: "0 0/10 * * *" # this is just a placeholder, configure in your flux
  concurrencyPolicy: Forbid

