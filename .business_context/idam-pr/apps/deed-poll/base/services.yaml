services:
  deed-poll-admin:
    client_id: deed-poll-admin
    vault: deed-poll-<<ENV>>
    client_secret: <<vault.idam-client-secret>>
    hmcts_access:
      idam_frontend: HMCTS_ACCESS
      mfa_required: false
      self_registration_allowed: false
      sso_providers:
        - moj
    oauth2:
      required_issuer: IDAM
      grant_types:
        - authorization_code
        - refresh_token
      scopes:
        - openid
        - profile
        - roles
        - offline_access
      redirect_uris: [] # Production TBD - add when production hostname is known
    oidc:
      post_logout_redirect_uris: [] # Production TBD - add when production hostname is known
