nodeLinker: node-modules

# The pipeline's security stage runs `yarn npm audit`, which reports a deprecated package as a Moderate finding.
# OpenTelemetry deprecated its 2.x sdk-trace-* line (and propagator-jaeger) on 2026-10-20 in favour of
# @opentelemetry/sdk-trace 3.x, but @azure/monitor-opentelemetry and its exporter still depend on the 2.x packages,
# so they cannot be removed yet. Only these four deprecation notices are ignored, by exact ID; any real advisory,
# in these packages or anywhere else, still fails the build. Remove each line once nothing depends on its package.
npmAuditIgnoreAdvisories:
  - "@opentelemetry/propagator-jaeger (deprecation)"
  - "@opentelemetry/sdk-trace-base (deprecation)"
  - "@opentelemetry/sdk-trace-node (deprecation)"
  - "@opentelemetry/sdk-trace-web (deprecation)"
# @azure/msal-node GHSA-xcx6-jx8p-x3h5 (npm advisory 1243111, high, 2026-10): the authorization code flow may
# disclose parameters to an attacker-controlled endpoint; fixed only in 7.1.0+. @azure/identity 4.14.0 (the latest)
# still requires ^6.0.0, and there is no patched 6.x, so the fix cannot be taken without forcing a msal-node major
# under @azure/identity on the vault path every pod runs at startup. This app reaches msal only through
# DefaultAzureCredential (libs/cloud-native-platform/src/properties-volume/azure-vault.ts), which uses environment,
# workload identity, managed identity or the Azure CLI, never the authorization code flow. Remove this line as soon
# as @azure/identity accepts msal-node >=7.1.0.
  - "1243111"
